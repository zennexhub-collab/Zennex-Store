<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - ZenneX</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        padding-bottom: 100px;
        background-color: #e2f9e0;
        box-sizing: border-box;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        background-color: #ffffff;
        flex-wrap: wrap;
      }
      .logo {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        cursor: pointer;
      }
      .logo img {
        height: 50px;
        margin-right: 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      .store-name {
        font-size: 24px;
        color: #333;
        cursor: pointer;
      }
      .X {
        color: #037101;
        font-weight: bold;
        font-size: 28px;
      }
      .links a {
        margin-right: 15px;
        text-decoration: none;
        color: #333;
        font-weight: bold;
        transition: all 0.3s ease;
      }
      .links a:hover {
        border-bottom: 3px solid rgb(15, 255, 15);
        padding-bottom: 3px;
      }

      .contact-img-box {
        text-align: center;
        margin-top: 50px;
        width: 80%;
        height: 400px;
        margin-left: 10%;
      }
      .contact-img {
        width: 100%;
        height: 100%;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        object-fit: cover;
        filter: brightness(50%);
      }
      .contact-content {
        text-align: center;
        margin-top: 30px;
      }
      .contact-content h1 {
        font-size: 40px;
        color: #333;
      }
      .contact-content p {
        font-size: 20px;
        color: #666;
      }
      .form {
        width: 50%;
        margin: 50px auto;
        background-color: #fff;
        padding: 100px 50px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .form label {
        display: block;
        margin-bottom: 10px;
        font-weight: bold;
      }
      .form input,
      .form textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      .form textarea {
        resize: vertical;
        height: 100px;
      }
      .form button {
        padding: 10px 20px;
        background-color: #037101;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
      .form button:hover {
        background-color: #025a01;
      }
      .brand-select {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 6px;
        color: #333;
        font-size: 15px;
        cursor: pointer;
        margin-bottom: 20px;
      }
      footer {
        text-align: center;
        background-color: #f8f8f8;
        color: rgb(0, 0, 0);
        position: fixed;
        bottom: 0;
        width: 100%;
      }

      @media (max-width: 700px) {
        .logo img {
          margin-left: 85px;
        }
        .links{
          margin-left: 30px;
        }
        .form {
          width: 90%;
          padding: 50px 20px;
        }
        .contact-img-box {
          width: 90%;
          height: 300px;
          margin-left: 5%;
        }
        
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <img href="index.html" src="images/zennexhub.png" alt="Logo" />
        <h2 class="store-name">Zenne<span class="X">X</span></h2>
      </div>
      <div class="links">
        <a href="index.html" class="Home">Home</a>
        <a href="products.html" class="Products">Products</a>
        <a href="contact.html" class="Contact">Contact</a>
        <a href="services.html" class="Service">Services</a>
        
      </div>
    </div>

    <div>
      <div class="contact-img-box">
        <img
          src="images/Gaming mouse.jpg"
          alt="Contact Image"
          class="contact-img"
        />
      </div>
      <div class="contact-content">
        <h1>Contact Us</h1>
        <p>Have questions or feedback? We'd love to hear from you!</p>
      </div>
    </div>

    <div>
      <div class="form">
        <form>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />

          <label for="subject">Subject:</label>
          <input type="text" id="subject" name="subject" required />

          <label for="brand">Laptop Brand:</label>
          <select name="brand" class="brand-select" required>
            <option value="" selected disabled>Select Laptop Brand</option>
            <option value="HP">HP</option>
            <option value="Dell">Dell</option>
            <option value="Lenovo">Lenovo</option>
            <option value="Apple">Apple</option>
            <option value="ASUS">ASUS</option>
            <option value="Acer">Acer</option>
            <option value="MSI">MSI</option>
          </select>

          <label for="message">Message:</label>
          <textarea id="message" name="message" required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </div>
    </div>
    <footer>
      <p>&copy; 2026 Zennex Digital Hub. All rights reserved.</p>
  </body>
</html>
