<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <style>
        body {
          margin: 0;
          font-family: Arial, sans-serif;
          padding-bottom: 100px;
          background-color: #e2f9e0;
          box-sizing: border-box;
        }
        .header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 10px 20px;
          background-color: #f8f8f8;
          flex-wrap: wrap;
        }
        .logo {
          display: flex;
          align-items: center;
          flex-wrap: wrap;
        }
        .logo img {
          height: 50px;
          margin-right: 10px;
          border-radius: 8px;
        }
        .store-name {
          font-size: 24px;
          color: #333;
        }
        .X {
          color: #037101;
          font-weight: bold;
          font-size: 28px;
        }
        .links a {
          margin-right: 15px;
          text-decoration: none;
          color: #333;
          font-weight: bold;
          transition: all 0.3s ease;
        }
        .links a:hover {
          border-bottom: 3px solid rgb(15, 255, 15);
          padding-bottom: 3px;
        }
        .cartlogo {
          height: 40px;
          margin-right: 10px;
          cursor: pointer;
          width: 50px;
        }
        .cartlogo:hover {
          transform: scale(1.1);
          transition: all 0.3s ease;
          border-radius: 50%;
        }
        .home-button:hover {
          background-color: #050505;
        }
        .product-section {
          margin-top: 40px;
          padding: 20px;
        }
        .section-title {
          font-size: 28px;
          margin-bottom: 20px;
          color: #04ff00;
          text-align: center;
        }
        .product-grid {
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
          justify-content: space-evenly;
        }
        .product-card {
          background-color: #f8f8f8;
          padding: 20px;
          border-radius: 8px;
          text-align: left;
          transition: all 0.3s ease;
          border: 2px solid #000000;
          width: 220px;
          margin-top: 20px;
        }
        .product-card:hover {
          transform: translateX(-5px);
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .product-image {
          width: 100%;
          height: 200px;
          object-fit: cover;
          border-radius: 8px;
          margin-bottom: 15px;
        }
        .product-title {
          font-size: 20px;
          margin-bottom: 10px;
          color: #04ff00;
        }
        .product-description {
          font-size: 14px;
          margin-bottom: 15px;
          color: #333;
        }
        .product-button {
          padding: 10px 20px;
          background-color: #04ff00;
          color: black;
          border: none;
          cursor: pointer;
          border-radius: 4px;
          font-weight: bold;
          transition: all 0.3s ease;
        }
        .product-button:hover {
          background-color: #ffffff;
          color: black;
          padding: 12px 25px;
          border-radius: 0px;
        }
        .product-button:active {
          transform: scale(0.95);
        }
        footer {
          background-color: #f8f8f8;
          text-align: center;
          padding: 10px 0;
          position: fixed;
          bottom: 0;
          width: 100%;
          box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 700px) {
          .cartlogo {
            position: absolute;
            right: 10px;
            top: 20px;
            width: 60px;
            height: 50px;
          }
          .logo {
            margin-left: 25%;
          }
          .links {
            margin-left: 8%;
          }
          .home-button {
            margin-top: 10px;
            margin-left: 35%;
          }
          .product-card {
            width: 120px;
          }
          .product-title {
            margin-bottom: 5px;
          }
          .product-image {
            margin-bottom: 0px;
          }
        }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <img src="images/zennexhub.png" alt="Logo" />
        <h2 class="store-name">Zenne <span class="X">X</span></h2>
      </div>
      <div class="links">
        <a href="index.html" class="Home">Home</a>
        <a href="products.html" class="Products">Products</a>
        <a href="contact.html" class="Contact">Contact</a>
        <a href="service.html" class="Service">Services</a>
      </div>
      <img class="cartlogo" src="images/cartlogo.jpg" alt="Cart" />
    </div>

    <div class="product-section">
      <h2 class="section-title">Featured Digital Products</h2>
      <div class="product-grid"></div>
    </div>
    <footer>
      <p>&copy; 2026 Zennex Digital Hub. All rights reserved.</p>
    </footer>

    <script>
      const products = [
        {
          image: "images/Gaming mouse.jpg",
          name: "Gaming Mouse",
          description:
            "Experience smooth movement, precise control, and comfortable gaming with a high-performance mouse",
          price: "$200",
        },
        {
          image: "images/keyboard.jpg",
          name: "Mechanical Keyboard",
          description:
            "Enjoy the tactile feedback and responsive keys of our premium mechanical keyboard.",
          price: "$450",
        },
        {
          image: "images/hearphone.jpg",
          name: "Wireless Headphones",
          description:
            "Immerse yourself in crystal-clear sound with our premium wireless headphones",
          price: "$500",
        },
        {
          image: "images/monitor.jpg",
          name: "Gaming Monitor",
          description:
            "Experience stunning visuals and smooth performance with our high-resolution gaming monitor",
          price: "$300",
        },
        {
          image: "images/stand.jpg",
          name: "Laptop Stand",
          description:
            "Elevate your laptop to a comfortable height for better ergonomics and improved productivity",
          price: "$200",
        },
        {
          image: "images/flash.jpg",
          name: "USB Flash Drive",
          description: "High-speed USB flash drive with ample storage capacity",
          price: "$350",
        },
        {
          image: "images/motherboard.jpg",
          name: "Motherboard",
          description:
            "High-quality motherboard with advanced features for optimal performance.",
          price: "$400",
        },
        {
          image: "images/Gaming mouse.jpg",
          name: "Gaming Mouse",
          description:
            "Experience smooth movement, precise control, and comfortable gaming with a high-performance mouse",
          price: "$150",
        },
        {
          image: "images/keyboard.jpg",
          name: "Mechanical Keyboard",
          description:
            "Enjoy the tactile feedback and responsive keys of our premium mechanical keyboard.",
          price: "$300",
        },
        {
          image: "images/hearphone.jpg",
          name: "Wireless Headphones",
          description:
            "Immerse yourself in crystal-clear sound with our premium wireless headphones",
          price: "$250",
        },
        {
          image: "images/stand.jpg",
          name: "Laptop Stand",
          description:
            "Elevate your laptop to a comfortable height for better ergonomics and improved productivity",
          price: "$300",
        },
        {
          image: "images/flash.jpg",
          name: "USB Flash Drive",
          description: "High-speed USB flash drive with ample storage capacity",
          price: "$200",
        },
      ];

      let productHTML = "";

      products.forEach((products) => {
        productHTML =
          productHTML +
          `
      <div class="product-card">
        <img src="${products.image}" class="product-image">
        <h3 class="product-title">${products.name}</h3>
        <p class="product-description">${products.description}</p>
        <h3 class="price">${products.price}</h3>
        <button class="product-button">Buy Now</button>
      </div>
    `;
      });

      document.querySelector(".product-grid").innerHTML = productHTML;
    </script>
  </body>
</html>
